[project]
name = "verbatim"
version = "0.1.0"
description = "Grounded Q&A over your own documents: every answer is a verbatim excerpt, selected by TypeSafe judgments. Nothing is generated."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "rapidocr-onnxruntime>=1.4.4",
    "typesafe-sdk>=0.7.0",
]

[tool.fastapi]
entrypoint = "verbatim.app:app"
